name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:           # manuális indítás engedélyezése

# A Pages deployhoz szükséges minimum jogosultságok
permissions:
  contents: read
  pages: write
  id-token: write              # OIDC tokenhez a deploy-pages-nek

# Egyszerre csak egy deploy fusson; az újabb push megszakítja a régit
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs        # ezt a könyvtárat tesszük közzé

  deploy:
    needs: build              # csak sikeres build után fusson
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
