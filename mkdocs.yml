site_name: Felhőalapú számítástechnika
site_description: Kurzus dokumentáció és IaC segédanyagok
site_url: https://ekke-edu.github.io/cloud-computing/

theme: 
  name: material
  language: hu
  features:
    - navigation.tabs
    - navigation.top

extra: 
  alternate:
    - name: Magyar
      link: /cloud-computing/
      lang: hu
    - name: English
      link: /cloud-computing/en/
      lang: en

nav:
  - Kezdőlap: index.md
  - Felhőszolgáltatások: cloud-services.md
  - IaC: iac.md
  - GitHub Actions: github-actions.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: hu
          name: Magyar
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Kezdőlap: Home
            Felhőszolgáltatások: Cloud Services
            IaC: IaC
            GitHub Actions: GitHub Actions
